name: SituationSim
options:
  bundleIdPrefix: com.martyvasquez
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 3CFUB9TT83
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  SituationSim:
    type: application
    platform: iOS
    sources:
      - SituationSim
    info:
      path: SituationSim/Info.plist
      properties:
        CFBundleDisplayName: Situations
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.martyvasquez.SituationSim
        TARGETED_DEVICE_FAMILY: "2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
  SituationSimTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SituationSimTests
    dependencies:
      - target: SituationSim
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.martyvasquez.SituationSimTests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "2"
  SituationSimUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - SituationSimUITests
    dependencies:
      - target: SituationSim
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.martyvasquez.SituationSimUITests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "2"
        TEST_TARGET_NAME: SituationSim
schemes:
  SituationSim:
    build:
      targets:
        SituationSim: all
        SituationSimTests: [test]
        SituationSimUITests: [test]
    test:
      targets:
        - SituationSimTests
        - SituationSimUITests
