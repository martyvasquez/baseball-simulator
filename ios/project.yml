name: SituationSim
options:
  bundleIdPrefix: com.martyvasquez
  deploymentTarget:
    iOS: "26.0"
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    majorVersion: 2.6.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 3CFUB9TT83
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  SituationSim:
    type: application
    platform: iOS
    sources:
      - SituationSim
    info:
      path: SituationSim/Info.plist
      properties:
        CFBundleDisplayName: Situations
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.martyvasquez.SituationSim
        TARGETED_DEVICE_FAMILY: "2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
  SituationSimTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SituationSimTests
    dependencies:
      - target: SituationSim
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.martyvasquez.SituationSimTests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "2"
  SituationSimUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - SituationSimUITests
    dependencies:
      - target: SituationSim
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.martyvasquez.SituationSimUITests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "2"
        TEST_TARGET_NAME: SituationSim
  SituationSimMac:
    type: application
    platform: macOS
    sources:
      - path: SituationSim
        excludes:
          - Info.plist
    dependencies:
      - package: Sparkle
    info:
      path: SituationSimMac/Info.plist
      properties:
        CFBundleName: Situations
        CFBundleDisplayName: Situations
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Self-updating from GitHub Releases (see .github/workflows/release-mac.yml).
        SUFeedURL: https://github.com/martyvasquez/baseball-simulator/releases/latest/download/appcast.xml
        SUPublicEDKey: bXJpu//h4FK4lq+dF05izwGsvmZnIV3UIHP7CqPgKV0=
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: true
        SUVerifyUpdateBeforeExtraction: true
        LSApplicationCategoryType: public.app-category.education
        NSHumanReadableCopyright: A baseball situations teaching tool.
    settings:
      base:
        PRODUCT_NAME: Situations
        PRODUCT_MODULE_NAME: SituationSim
        PRODUCT_BUNDLE_IDENTIFIER: com.martyvasquez.SituationSim
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIconMac
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: NO
        COMBINE_HIDPI_IMAGES: YES
  SituationSimMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - SituationSimTests
    dependencies:
      - target: SituationSimMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.martyvasquez.SituationSimMacTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Situations.app/Contents/MacOS/Situations
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  SituationSim:
    build:
      targets:
        SituationSim: all
        SituationSimTests: [test]
        SituationSimUITests: [test]
    test:
      targets:
        - SituationSimTests
        - SituationSimUITests
  SituationSimMac:
    build:
      targets:
        SituationSimMac: all
        SituationSimMacTests: [test]
    test:
      targets:
        - SituationSimMacTests
